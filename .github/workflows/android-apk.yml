# Builds the Android TV / Fire TV app on GitHub — no Android Studio needed.
# 1. Push this project to a GitHub repository
# 2. Settings → Secrets and variables → Actions → Variables: add PLAYER_URL
#    (e.g. https://signage.yourdomain.com/player.html)
# 3. Actions → "Build TV app" → Run workflow. Download the APK from the run.
name: Build TV app
on:
  workflow_dispatch:
  push:
    paths: ['android/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Use the runner's preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > local.properties
          ls "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/platforms" | tail -3
      - uses: gradle/actions/setup-gradle@v4
      - name: Decode signing key (optional)
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.jks && echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV
      - name: Build APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PPLAYER_URL="${{ vars.PLAYER_URL || 'https://proview92.github.io/signage/player.html' }}"
          mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/signage-tv.apk
      - uses: actions/upload-artifact@v4
        with:
          name: signage-tv-apk
          path: android/app/build/outputs/apk/release/signage-tv.apk
      - name: Publish as the latest release (direct download link for Fire TV)
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="tv-v${{ github.run_number }}"
          gh release create "$TAG" app/build/outputs/apk/release/signage-tv.apk \
            --title "Signage TV app (build ${{ github.run_number }})" \
            --notes "Install on Android TV / Fire TV. Direct link: https://github.com/${{ github.repository }}/releases/latest/download/signage-tv.apk" \
            --latest
